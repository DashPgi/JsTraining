<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <title>My Calculator!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- <div class="title-bar">
    <button id="minimize">−</button>
    <button id="close">×</button>
  </div> -->
  <main>
    <input type="text" id="input-screen" value="0" readonly>
    <div class="extra-buttons">
      <button class="exbtn" id="">MC</button>
      <button class="exbtn" id="">MR</button>
      <button class="exbtn" id="">M+</button>
      <button class="exbtn" id="">M-</button>
      <button class="exbtn" id="">Ms</button>
      <button class="exbtn" id="">M,</button>
    </div>
    <div class="control-buttons">
      <button class="btn" id="">%</button>
      <button class="btn" id="">CE</button>
      <button class="btn" id="">C</button>
      <button class="btn">⌫</button>
      <button class="btn">1/x</button>
      <button class="btn">x^2</button>
      <button class="btn" id="">xroot2</button>
      <button class="btn">÷</button>
      <button class="btn" id="">7</button>
      <button class="btn" id="">8</button>
      <button class="btn" id="">9</button>
      <button class="btn">×</button>
      <button class="btn" id="">4</button>
      <button class="btn" id="">5</button>
      <button class="btn" id="">6</button>
      <button class="btn" id="">-</button>
      <button class="btn" id="">1</button>
      <button class="btn" id="">2</button>
      <button class="btn" id="">3</button>
      <button class="btn">+</button>
      <button class="btn" id="">+/-</button>
      <button class="btn" id="">0</button>
      <button class="btn" id="">.</button>
      <button class="btn" id="">=</button>
    </div>
  </main>
</body> 
<script src="render.js"></script>

</html>
